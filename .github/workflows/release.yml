name: Release

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish-release:
    name: Publish release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: Grayjay.Desktop-win-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: release-artifact

      - name: Create or update release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const tag = 'latest';
            const releaseName = 'Latest Windows x64';
            const body = `Automated build from ${headSha}`;

            const artifactDir = path.join(process.env.GITHUB_WORKSPACE, 'release-artifact');
            const files = fs.readdirSync(artifactDir).filter(f => f.endsWith('.zip'));
            if (files.length === 0) throw new Error('No zip artifact found');

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id,
                tag_name: tag, target_commitish: headSha,
                name: releaseName, body, draft: false, prerelease: false
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: headSha,
                name: releaseName, body, draft: false, prerelease: false
              })).data;
            }

            const existing = (await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: release.id, per_page: 100
            })).data;
            for (const file of files) {
              for (const asset of existing.filter(a => a.name === file)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
              const assetPath = path.join(artifactDir, file);
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: file,
                headers: { 'content-length': data.length, 'content-type': 'application/zip' },
                data
              });
              core.info(`Uploaded ${file}`);
            }

            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/latest' });
              await github.rest.git.updateRef({ owner, repo, ref: 'tags/latest', sha: headSha, force: true });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: 'refs/tags/latest', sha: headSha });
            }
