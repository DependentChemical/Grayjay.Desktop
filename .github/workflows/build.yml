name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix JustCef Expand-Archive for PowerShell 7
        shell: pwsh
        run: |
          $script = "JustCef/cs/ensure-justcef-win.ps1"
          if (Test-Path $script) {
            $fixedScript = @'
param(
  [Parameter(Mandatory=$true)][string]$Url,
  [Parameter(Mandatory=$true)][string]$ZipPath,
  [Parameter(Mandatory=$true)][string]$ExtractDir,
  [Parameter(Mandatory=$true)][string]$Version
)

$ErrorActionPreference = "Stop"

$markerVersion = Join-Path $ExtractDir ".justcef.version"
$markerUrl     = Join-Path $ExtractDir ".justcef.url"

function Test-DirNonEmpty([string]$Path) {
  if (!(Test-Path -LiteralPath $Path -PathType Container)) { return $false }
  return @(Get-ChildItem -LiteralPath $Path -Force -ErrorAction SilentlyContinue).Count -gt 0
}

$zipBytes = [System.Text.Encoding]::UTF8.GetBytes($ZipPath.ToLowerInvariant())
$sha = [System.Security.Cryptography.SHA256]::Create()
$hash = ($sha.ComputeHash($zipBytes) | ForEach-Object { $_.ToString("x2") }) -join ""
$mutexName = "Global\JustCef_$hash"
$mutex = New-Object System.Threading.Mutex($false, $mutexName)

$null = $mutex.WaitOne()
try {
  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $ZipPath) | Out-Null
  New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

  if ((Test-Path -LiteralPath $markerVersion) `
      -and ((Get-Content -LiteralPath $markerVersion -Raw).Trim() -eq $Version) `
      -and (Test-Path -LiteralPath $ZipPath) `
      -and (Test-DirNonEmpty $ExtractDir)) {
    exit 0
  }

  if (!(Test-Path -LiteralPath $ZipPath)) {
    Write-Host "JustCef: downloading $Url"
    $parent = Split-Path -Parent $ZipPath
    $tmp = Join-Path $parent ("{0}.tmp" -f [System.IO.Path]::GetRandomFileName())
    Invoke-WebRequest -Uri $Url -OutFile $tmp -UseBasicParsing
    Move-Item -LiteralPath $tmp -Destination $ZipPath -Force
  }

  if (Test-Path -LiteralPath $ExtractDir) {
    Remove-Item -LiteralPath $ExtractDir -Recurse -Force
  }
  New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

  # Use .NET ZipFile.ExtractToDirectory (supports overwrite in .NET 8+)
  Add-Type -AssemblyName System.IO.Compression.FileSystem
  [System.IO.Compression.ZipFile]::ExtractToDirectory($ZipPath, $ExtractDir, $true)

  $entries = Get-ChildItem -LiteralPath $ExtractDir -Force
  if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) {
    $inner = $entries[0].FullName
    $tmpFlatten = "${ExtractDir}.flatten"
    if (Test-Path -LiteralPath $tmpFlatten) { Remove-Item -LiteralPath $tmpFlatten -Recurse -Force }
    New-Item -ItemType Directory -Force -Path $tmpFlatten | Out-Null

    Get-ChildItem -LiteralPath $inner -Force | ForEach-Object {
      Move-Item -LiteralPath $_.FullName -Destination $tmpFlatten -Force
    }

    Remove-Item -LiteralPath $ExtractDir -Recurse -Force
    Move-Item -LiteralPath $tmpFlatten -Destination $ExtractDir -Force
  }

  Set-Content -LiteralPath $markerVersion -Value $Version -NoNewline
  Set-Content -LiteralPath $markerUrl -Value $Url -NoNewline
}
finally {
  $mutex.ReleaseMutex() | Out-Null
  $mutex.Dispose()
}
'@
            Set-Content $script -Value $fixedScript -NoNewline
          }

      - name: Build web assets
        shell: pwsh
        run: |
          cd Grayjay.Desktop.Web
          npm ci
          npm run build

      - name: Test
        shell: pwsh
        run: dotnet test Grayjay.Desktop.Tests/Grayjay.Desktop.Tests.csproj -c Release

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix JustCef Expand-Archive for PowerShell 7
        shell: pwsh
        run: |
          $script = "JustCef/cs/ensure-justcef-win.ps1"
          if (Test-Path $script) {
            $fixedScript = @'
param(
  [Parameter(Mandatory=$true)][string]$Url,
  [Parameter(Mandatory=$true)][string]$ZipPath,
  [Parameter(Mandatory=$true)][string]$ExtractDir,
  [Parameter(Mandatory=$true)][string]$Version
)

$ErrorActionPreference = "Stop"

$markerVersion = Join-Path $ExtractDir ".justcef.version"
$markerUrl     = Join-Path $ExtractDir ".justcef.url"

function Test-DirNonEmpty([string]$Path) {
  if (!(Test-Path -LiteralPath $Path -PathType Container)) { return $false }
  return @(Get-ChildItem -LiteralPath $Path -Force -ErrorAction SilentlyContinue).Count -gt 0
}

$zipBytes = [System.Text.Encoding]::UTF8.GetBytes($ZipPath.ToLowerInvariant())
$sha = [System.Security.Cryptography.SHA256]::Create()
$hash = ($sha.ComputeHash($zipBytes) | ForEach-Object { $_.ToString("x2") }) -join ""
$mutexName = "Global\JustCef_$hash"
$mutex = New-Object System.Threading.Mutex($false, $mutexName)

$null = $mutex.WaitOne()
try {
  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $ZipPath) | Out-Null
  New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

  if ((Test-Path -LiteralPath $markerVersion) `
      -and ((Get-Content -LiteralPath $markerVersion -Raw).Trim() -eq $Version) `
      -and (Test-Path -LiteralPath $ZipPath) `
      -and (Test-DirNonEmpty $ExtractDir)) {
    exit 0
  }

  if (!(Test-Path -LiteralPath $ZipPath)) {
    Write-Host "JustCef: downloading $Url"
    $parent = Split-Path -Parent $ZipPath
    $tmp = Join-Path $parent ("{0}.tmp" -f [System.IO.Path]::GetRandomFileName())
    Invoke-WebRequest -Uri $Url -OutFile $tmp -UseBasicParsing
    Move-Item -LiteralPath $tmp -Destination $ZipPath -Force
  }

  if (Test-Path -LiteralPath $ExtractDir) {
    Remove-Item -LiteralPath $ExtractDir -Recurse -Force
  }
  New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

  # Use .NET ZipFile.ExtractToDirectory (supports overwrite in .NET 8+)
  Add-Type -AssemblyName System.IO.Compression.FileSystem
  [System.IO.Compression.ZipFile]::ExtractToDirectory($ZipPath, $ExtractDir, $true)

  $entries = Get-ChildItem -LiteralPath $ExtractDir -Force
  if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) {
    $inner = $entries[0].FullName
    $tmpFlatten = "${ExtractDir}.flatten"
    if (Test-Path -LiteralPath $tmpFlatten) { Remove-Item -LiteralPath $tmpFlatten -Recurse -Force }
    New-Item -ItemType Directory -Force -Path $tmpFlatten | Out-Null

    Get-ChildItem -LiteralPath $inner -Force | ForEach-Object {
      Move-Item -LiteralPath $_.FullName -Destination $tmpFlatten -Force
    }

    Remove-Item -LiteralPath $ExtractDir -Recurse -Force
    Move-Item -LiteralPath $tmpFlatten -Destination $ExtractDir -Force
  }

  Set-Content -LiteralPath $markerVersion -Value $Version -NoNewline
  Set-Content -LiteralPath $markerUrl -Value $Url -NoNewline
}
finally {
  $mutex.ReleaseMutex() | Out-Null
  $mutex.Dispose()
}
'@
            Set-Content $script -Value $fixedScript -NoNewline
          }

      - name: Build web assets
        shell: pwsh
        run: |
          cd Grayjay.Desktop.Web
          npm ci
          npm run build

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish Grayjay.Desktop.CEF/Grayjay.Desktop.CEF.csproj -r win-x64 -c Release
          $publishDir = "Grayjay.Desktop.CEF/bin/Release/net8.0/win-x64/publish"
          $wwwroot = Join-Path $publishDir "wwwroot/web"
          New-Item -ItemType Directory -Force -Path $wwwroot | Out-Null
          Copy-Item -Recurse -Force "Grayjay.Desktop.Web/dist/*" $wwwroot
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path dist/Grayjay.Desktop-win-x64.zip) { Remove-Item dist/Grayjay.Desktop-win-x64.zip -Force }
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath dist/Grayjay.Desktop-win-x64.zip -Force

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Grayjay.Desktop-win-x64
          path: dist/Grayjay.Desktop-win-x64.zip
          if-no-files-found: error